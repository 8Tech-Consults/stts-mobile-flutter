name: STTS
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutx: ^0.2.0-rc.4
  boxicons: ^2.1.3

  connectivity_plus: ^6.1.5
  dio: ^5.9.0 # Use the latest dio package
  cupertino_icons: ^1.0.8 # Updated to the latest stable version
  provider: ^6.1.2
  google_fonts: ^5.1.0 # Updated to the latest stable version
  cached_network_image: ^3.3.1
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  json_annotation: ^4.8.1
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  url_launcher: ^6.2.5
  sqflite: ^2.3.2
  get: ^4.6.6
  flutter_native_splash: ^2.3.5
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  fluttertoast: ^8.2.4
  shared_preferences: ^2.2.2
  analyzer: ^7.7.1
  get_it: ^8.2.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.0.10+1
  flextras: ^1.0.0
  mobile_scanner: ^7.0.1
  intl: any # Updated to a compatible version

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.1.0
  build_runner: ^2.6.0
  build_runner_core: ^9.2.0
  json_serializable: ^6.10.0
  material_design_icons_flutter: ^7.0.7296
  flutter_feather_icons: ^2.0.0+1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1


